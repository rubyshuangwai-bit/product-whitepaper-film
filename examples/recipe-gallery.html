<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><script src="assets/gsap.min.js"></script><script src="assets/pwf-motion.js"></script><style>
@font-face{font-family:Film;src:url(assets/fonts/sans-400.woff2);font-weight:400}@font-face{font-family:Film;src:url(assets/fonts/sans-700.woff2);font-weight:700}*{box-sizing:border-box;margin:0}body,#root{width:1920px;height:1080px;overflow:hidden;background:#eff4fb;color:#17365a;font-family:Film,sans-serif}#root{position:relative}.scene,.cam{position:absolute;inset:0}.scene{opacity:0}.title{position:absolute;left:140px;top:120px;font-size:74px;font-weight:700}.desc{position:absolute;left:145px;top:225px;font-size:33px;color:#526c8d}.card{opacity:0;position:absolute;left:140px;top:350px;width:450px;height:230px;border:2px solid #bdd2ed;border-radius:24px;background:white;padding:45px 35px;font-size:45px;font-weight:700;transform-origin:0 0}.card small{display:block;margin-top:25px;font-size:28px;color:#58718e;font-weight:400}.tag{position:absolute;left:145px;bottom:100px;font-size:31px;color:#526c8d;opacity:0}.note{position:absolute;right:140px;bottom:100px;font-size:26px;color:#526c8d}.node{position:absolute;width:390px;height:140px;background:white;border:2px solid #bdd2ed;border-radius:20px;padding:42px 25px;text-align:center;font-size:39px}.base{background:#dce9ff;color:#1d61b8}.wire{position:absolute;inset:0;pointer-events:none}.wire path{fill:none;stroke:#2670d5;stroke-width:6;opacity:0;stroke-linecap:round;stroke-linejoin:round}.wire circle{fill:#175dbf;opacity:0}.rail{position:absolute;left:140px;top:430px;width:1640px;height:220px;background:#fff9;border:2px solid #d7e2f2;border-radius:25px}.label{position:absolute;top:700px;font-size:34px;font-weight:700;text-align:center;width:300px}.line-mask{position:absolute;left:140px;overflow:hidden;height:130px;width:1640px}.line-mask span{display:block;font-size:84px;font-weight:700;opacity:0;line-height:1.5}.accent{color:#2266c8}
</style></head><body><div id="root" data-composition-id="recipe-gallery" data-start="0" data-duration="28" data-width="1920" data-height="1080">
<div id="layout-scene" class="scene clip" data-start="0" data-duration="7"><div class="cam"><div class="title">布局重组</div><div class="desc">同一张卡片，从整体介绍进入重点，再回到全貌</div>
<div id="a" class="card">产品能力<small>先看整体，再讲重点</small></div><div id="b" class="card" style="left:735px">配置管理<small>对象保持一致</small></div><div id="c" class="card" style="left:1330px">资料条目<small>布局随讲述变化</small></div><div class="tag" id="layout-tag">放大重点 · 保留上下文 · 归位收束</div></div></div>
<div id="draw-scene" class="scene clip" data-start="7" data-duration="7"><div class="cam"><div class="title">关系连线</div><div class="desc">资料逐份展示，再建立面向查阅的关联关系</div>
<div class="node" style="left:140px;top:360px">资料集合一</div><div class="node" style="left:140px;top:650px">资料集合二</div><div class="node base" id="platform" style="left:815px;top:510px">资料工作区</div><div class="node" style="left:1390px;top:510px">原文查阅</div>
<svg class="wire" viewBox="0 0 1920 1080"><path id="w1" d="M530 430 H665 Q700 430 700 465 V545 Q700 580 735 580 H815"/><path id="w2" d="M530 720 H665 Q700 720 700 685 V615 Q700 580 735 580 H815"/><path id="w3" d="M1205 580 H1390"/><circle id="d1" r="8"/><circle id="d2" r="8"/></svg><div class="tag" id="draw-tag">按讲述建立关系，避免一屏全部出现</div></div></div>
<div id="path-scene" class="scene clip" data-start="14" data-duration="7"><div class="cam"><div class="title">沿线运动</div><div class="desc">光点平滑经过弯曲路径，表达方向与到达</div><div class="rail"></div>
<svg class="wire" viewBox="0 0 1920 1080"><path id="route" d="M230 540 C430 350 690 730 960 540 S1490 350 1690 540"/><circle id="traveller" r="13"/></svg><div class="label" style="left:140px">资料来源</div><div class="label" style="left:810px">整理条目</div><div class="label" id="arrived" style="left:1480px">查阅原文</div><div class="tag" id="path-tag">概念流向示意，不表示实测时延</div></div></div>
<div id="text-scene" class="scene clip" data-start="21" data-duration="7"><div class="cam"><div class="title">文字分层</div><div class="desc">按完整语义逐行揭示，让观众跟上讲解</div><div class="line-mask" style="top:350px"><span id="line1">从产品白皮书</span></div><div class="line-mask" style="top:500px"><span id="line2">到客户看得懂的</span></div><div class="line-mask" style="top:650px"><span id="line3" class="accent">产品宣传视频</span></div><div class="tag" id="text-tag">可替换文字与时间，不依赖逐字插件</div></div></div>
<div class="note">通用配方演示</div></div><script>
const tl=gsap.timeline({paused:true});window.__timelines=window.__timelines||{};
['layout-scene','draw-scene','path-scene','text-scene'].forEach((s,i)=>{tl.set('#'+s,{opacity:1},i*7);if(i<3)tl.set('#'+s,{opacity:0},i*7+6.99);});
PWFRecipes.layout(tl,[{target:'#a',from:{x:0,y:40,opacity:0},to:{x:0,y:0,opacity:1}},{target:'#b',from:{x:0,y:40,opacity:0},to:{x:0,y:0,opacity:1}},{target:'#c',from:{x:0,y:40,opacity:0},to:{x:0,y:0,opacity:1}}],.1);
PWFRecipes.layout(tl,[{target:'#a',from:{x:0,y:0,scale:1},to:{x:0,y:-30,scale:1.55}},{target:'#b',from:{x:0,y:0},to:{x:350,y:-35}},{target:'#c',from:{x:0,y:0},to:{x:-245,y:255}}],1.7,{duration:.9,stagger:0});
PWFRecipes.layout(tl,[{target:'#a',from:{x:0,y:-30,scale:1.55},to:{x:0,y:0,scale:1}},{target:'#b',from:{x:350,y:-35},to:{x:0,y:0}},{target:'#c',from:{x:-245,y:255},to:{x:0,y:0}}],4.75,{duration:.9,stagger:0});PWF.reveal(tl,'#layout-tag',3.3);
PWFRecipes.stroke(tl,'#w1',7.5,{duration:1});PWFRecipes.follow(tl,'#d1','#w1',8.6,{duration:1});PWFRecipes.stroke(tl,'#w2',9.5,{duration:1});PWFRecipes.follow(tl,'#d2','#w2',10.6,{duration:1});PWFRecipes.stroke(tl,'#w3',11.6,{duration:.65});tl.to('#platform',{borderColor:'#2368c8',backgroundColor:'#cddfff',duration:.45},11.8);PWF.reveal(tl,'#draw-tag',12.3);
PWFRecipes.stroke(tl,'#route',14.2,{duration:1});PWFRecipes.follow(tl,'#traveller','#route',15.5,{duration:3.7});tl.to('#arrived',{color:'#2169cc',duration:.4},19.2);PWF.reveal(tl,'#path-tag',19.5);
PWFRecipes.lines(tl,['#line1','#line2','#line3'],[21.3,22.5,23.7],{duration:.75});PWF.reveal(tl,'#text-tag',25.2);tl.to('#text-tag',{x:0,duration:.01},27.99);
tl.seek(0);window.__timelines['recipe-gallery']=tl;
</script></body></html>
